name: Build Oct 8 report
on:
  push:
    paths:
      - 'tmp_oct8/report.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Word report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from xml.sax.saxutils import escape
          
          src = Path("tmp_oct8/report.txt").read_text(encoding="utf-8")
          lines = src.splitlines()
          paras = []
          for line in lines:
              if not line.strip():
                  paras.append("<w:p/>")
                  continue
              style = "Normal"
              text = line
              if line.startswith("# "):
                  style, text = "Title", line[2:]
              elif line.startswith("## "):
                  style, text = "Heading1", line[3:]
              elif line.startswith("### "):
                  style, text = "Heading2", line[4:]
              elif line.startswith("> "):
                  style, text = "Subtitle", line[2:]
              paras.append(
                  f'<w:p><w:pPr><w:pStyle w:val="{style}"/></w:pPr>'
                  f'<w:r><w:t xml:space="preserve">{escape(text)}</w:t></w:r></w:p>'
              )
          
          content_types = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
            <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
            <Default Extension="xml" ContentType="application/xml"/>
            <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
            <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
          </Types>'''
          rels = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
            <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
          </Relationships>'''
          doc_rels = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
            <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
          </Relationships>'''
          styles = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
            <w:style w:type="paragraph" w:default="1" w:styleId="Normal">
              <w:name w:val="Normal"/>
              <w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Microsoft YaHei"/><w:sz w:val="22"/></w:rPr>
              <w:pPr><w:spacing w:after="120"/></w:pPr>
            </w:style>
            <w:style w:type="paragraph" w:styleId="Title">
              <w:name w:val="Title"/><w:rPr><w:rFonts w:eastAsia="Microsoft YaHei"/><w:b/><w:sz w:val="36"/></w:rPr>
              <w:pPr><w:spacing w:after="200"/></w:pPr>
            </w:style>
            <w:style w:type="paragraph" w:styleId="Subtitle">
              <w:name w:val="Subtitle"/><w:rPr><w:rFonts w:eastAsia="Microsoft YaHei"/><w:color w:val="666666"/><w:sz w:val="22"/></w:rPr>
            </w:style>
            <w:style w:type="paragraph" w:styleId="Heading1">
              <w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:qFormat/>
              <w:rPr><w:rFonts w:eastAsia="Microsoft YaHei"/><w:b/><w:color w:val="8B1E1E"/><w:sz w:val="28"/></w:rPr>
              <w:pPr><w:spacing w:before="220" w:after="120"/></w:pPr>
            </w:style>
            <w:style w:type="paragraph" w:styleId="Heading2">
              <w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:qFormat/>
              <w:rPr><w:rFonts w:eastAsia="Microsoft YaHei"/><w:b/><w:sz w:val="24"/></w:rPr>
            </w:style>
          </w:styles>'''
          document = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
            <w:body>''' + "".join(paras) + '''<w:sectPr>
              <w:pgSz w:w="12240" w:h="15840"/>
              <w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080"/>
            </w:sectPr></w:body>
          </w:document>'''
          
          out = Path("reports/2026/10/2026-10-08.docx")
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(out, "w", ZIP_DEFLATED) as z:
              z.writestr("[Content_Types].xml", content_types)
              z.writestr("_rels/.rels", rels)
              z.writestr("word/document.xml", document)
              z.writestr("word/_rels/document.xml.rels", doc_rels)
              z.writestr("word/styles.xml", styles)
          PY
          
          rm -rf tmp_oct8
          rm -f .github/workflows/build-oct8-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add pre-market strategy report for 2026-10-08"
          git push
